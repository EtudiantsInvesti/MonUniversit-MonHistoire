
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon université, mon histoire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>Mon université, mon histoire</h1>

        <nav class="main-navigation">
            <a href="#carte" class="active">Carte du campus</a>
            <a href="#archives">Archives</a>
            <a href="#ligne-du-temps">Ligne du temps</a>
        </nav>
    </header>

    <main class="main-layout">

        <aside class="sidebar">
            <h2>Les pavillons</h2>

            <ul id="pavilion-list">
                <!-- Pavilion entries will be added with JavaScript later -->
            </ul>
        </aside>

        <section class="map-section" id="carte">
            <div class="map-container" id="map">

                <div class="map-placeholder">
                    <h2>Carte du campus</h2>
                    <p>Notre carte illustrée sera intégrée ici.</p>
                </div>

                <!-- Interactive map markers will go here later -->

            </div>
        </section>

        <aside class="information-panel" id="information-panel">
            <h2>À propos</h2>
            <p>Sélectionnez un pavillon ou un point d'intérêt pour découvrir son histoire.</p>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
