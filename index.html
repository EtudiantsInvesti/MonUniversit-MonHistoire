
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon université, mon histoire</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>Mon université, mon histoire</h1>

        <nav class="main-navigation">
            <a href="#carte" class="active">Carte du campus</a>
            <a href="#archives">Archives</a>
            <a href="#ligne-du-temps">Ligne du temps</a>
        </nav>
    </header>

    <main class="main-layout">

        <aside class="sidebar">
            <h2>Les pavillons</h2>

            <ul id="pavilion-list">
                <!-- Pavilion entries will be added with JavaScript later -->
            </ul>
        </aside>

     <section class="map-section" id="carte">
    <div class="map-container" id="map">

        <div class="map-placeholder">
            <h2>Carte du campus</h2>
            <p>Notre carte illustrée sera intégrée ici.</p>
        </div>

        <!-- Floating information popup -->
<aside class="information-popup" id="information-panel" hidden>

    <!-- Close button -->
    <button
        type="button"
        id="close-information"
        class="close-information"
        aria-label="Fermer">
        ×
    </button>

    <!-- Pavilion title -->
    <h2 id="information-title">Titre du pavillon</h2>

    <!-- Foundation year -->
    <div class="pavilion-detail">
        <h3>Année de fondation</h3>
        <p id="information-year">À déterminer</p>
    </div>

    <!-- Donor -->
    <div class="pavilion-detail">
        <h3>Donateur</h3>
        <p id="information-donor">À déterminer</p>
    </div>

    <!-- Relevant historical information -->
    <div class="pavilion-description">
        <h3>Informations pertinentes</h3>
        <p id="information-description">
            Informations historiques sur le pavillon.
        </p>
    </div>

</aside>

    </div>
</section>



    </main>

    <script src="script.js"></script>
    
</body>
</html>
